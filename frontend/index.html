<body>
  <div id="root">
    <!-- Fallback loading skeleton if JS is starting up -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #64748b; font-family: sans-serif; background: #f8fafc;">
      <div style="text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 12px;">🛡️</div>
        <h2 style="color: #0f172a; margin-bottom: 8px; font-weight: 800;">Nexentra Security Audit</h2>
        <p style="color: #64748b;">Loading Nexentra Cyber Defense Engine...</p>
      </div>
    </div>
  </div>

  <!-- Vite module entry point -->
  <script type="module">
    // Detect if running in Vite dev server or standalone Node.js server
    if (window.location.port === '3000' || window.location.port === '5173') {
      import('/src/main.jsx');
    }
  </script>

  <!-- Standalone direct Node.js serving fallback: compiles src/App.jsx on-the-fly -->
  <script type="text/babel">
    if (window.location.port === '5000' || !window.location.port) {
      // Fetch src/App.jsx and render directly with React 18
      fetch('/src/App.jsx')
        .then(res => res.text())
        .then(code => {
          // Strip export/import statements for Babel standalone execution
          const cleanCode = code
            .replace(/import\s+React[^;]*;/g, '')
            .replace(/import\s+.*from\s+['"][^'"]+['"];?/g, '')
            .replace(/export\s+default\s+function\s+App/g, 'function App');

          const transformed = Babel.transform(cleanCode, { presets: ['react'] }).code;
          eval(transformed);

          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(App));
        })
        .catch(err => {
          console.error("Failed to load App.jsx:", err);
        });
    }
  </script>
</body>
